<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibrChat</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eaf2f5;
      text-align: center;
    }
    header {
      background: #075e54;
      color: white;
      padding: 25px;
      font-size: 28px;
      font-weight: bold;
    }
    main {
      padding: 40px 20px;
    }
    input {
      padding: 14px;
      width: 80%;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      background: #075e54;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 8px;
      margin-top: 15px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>VibrChat</header>
  <main>
    <h2>Welcome to VibrChat!</h2>
    <p>آپ کی اپنی چیٹ ایپ</p>
    <input type="text" placeholder="اپنا نام لکھیں">
    <br>
    <button>شروع کریں</button>
  </main>
</body>
</html>
