<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibraChat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eaf1f3;color:#222}
header{background:#075e54;color:white;text-align:center;padding:18px}
main{max-width:460px;margin:20px auto;padding:12px}
.panel{background:white;padding:18px;border-radius:14px}
input{width:100%;padding:13px;margin:8px 0;border:1px solid #ccc;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;margin:6px 0;background:#075e54;color:white;border:0;border-radius:8px;font-size:16px}
#chat{display:none}
#messages{height:300px;overflow:auto;background:#f3f5f5;padding:10px;border-radius:8px}
.message{background:#dcf8c6;padding:10px;margin:8px;border-radius:10px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
<h1>VibraChat</h1>
<p>Connect with friends</p>
</header>
<main>
<div class="panel" id="login">
<h2>Phone Login</h2>
<input id="phone" placeholder="+923001234567">
<button id="sendOtp">Send OTP</button>
<div id="recaptcha-container"></div>
<input id="otp" placeholder="Enter OTP">
<button id="verifyOtp">Verify OTP</button>
<p id="status"></p>
</div>

<div class="panel" id="chat">
<h2 id="hello">VibraChat</h2>
<p>Shared chat room</p>
<div id="messages"></div>
<input id="messageInput" placeholder="Write a message">
<button id="sendMessage">Send Message</button>
<button id="logout">Log out</button>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
 getAuth,RecaptchaVerifier,signInWithPhoneNumber,
 onAuthStateChanged,signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
 getDatabase,ref,push,onChildAdded,serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

const firebaseConfig={
 apiKey:"AIzaSyCoLc8meb-WOyAsURXwg-7Svd80R5OcypM",
 authDomain:"vibrachat-dd3e7.firebaseapp.com",
 databaseURL:"https://vibrachat-dd3e7-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"vibrachat-dd3e7",
 storageBucket:"vibrachat-dd3e7.firebasestorage.app",
 messagingSenderId:"715602785688",
 appId:"1:715602785688:web:8d2afb8b94b0451d3867ed"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);

let confirmation=null;
let verifier=null;
let messagesStarted=false;

const login=document.getElementById("login");
const chat=document.getElementById("chat");
const statusText=document.getElementById("status");

document.getElementById("sendOtp").onclick=async()=>{
 try{
  const phone=document.getElementById("phone").value.trim();
  if(!phone.startsWith("+")){
   alert("Enter phone number with country code, e.g. +92");
   return;
  }
  if(!verifier){
   verifier=new RecaptchaVerifier(auth,"recaptcha-container",{size:"normal"});
  }
  statusText.textContent="Sending OTP...";
  confirmation=await signInWithPhoneNumber(auth,phone,verifier);
  statusText.textContent="OTP sent. Check your SMS.";
 }catch(error){
  statusText.textContent=error.message;
 }
};

document.getElementById("verifyOtp").onclick=async()=>{
 try{
  if(!confirmation){
   alert("Send OTP first.");
   return;
  }
  const code=document.getElementById("otp").value.trim();
  await confirmation.confirm(code);
  statusText.textContent="Login successful.";
 }catch(error){
  statusText.textContent=error.message;
 }
};

onAuthStateChanged(auth,user=>{
 if(user){
  login.style.display="none";
  chat.style.display="block";
  document.getElementById("hello").textContent="Welcome "+(user.phoneNumber||"User");

  if(!messagesStarted){
   messagesStarted=true;
   onChildAdded(ref(db,"messages"),snapshot=>{
    const data=snapshot.val();
    const box=document.createElement("div");
    box.className="message";
    const name=document.createElement("b");
    name.textContent=data.name||"User";
    const message=document.createElement("div");
    message.textContent=data.text||"";
    box.append(name,message);
    document.getElementById("messages").appendChild(box);
    const area=document.getElementById("messages");
    area.scrollTop=area.scrollHeight;
   });
  }
 }else{
  login.style.display="block";
  chat.style.display="none";
 }
});

document.getElementById("sendMessage").onclick=async()=>{
 try{
  const user=auth.currentUser;
  const input=document.getElementById("messageInput");
  const value=input.value.trim();
  if(!user||!value)return;
  await push(ref(db,"messages"),{
   uid:user.uid,
   name:user.phoneNumber||"User",
   text:value,
   time:serverTimestamp()
  });
  input.value="";
 }catch(error){
  alert(error.message);
 }
};

document.getElementById("logout").onclick=async()=>{
 await signOut(auth);
 location.reload();
};
</script>
</body>
</html>
